name: Build robot

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - wip

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: [ '1.27', stable ]
    name: Go ${{ matrix.go }} build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Lint
        run: make lint
      - name: Test
        run: make cover
